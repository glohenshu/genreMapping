<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ジャンルから探す｜ゴールドライフオンライン</title>
<meta name="description" content="ゴールドライフオンライン（GLO）の作品を、ジャンルと小さなジャンルから探せます。">
<meta property="og:title" content="ジャンルから探す｜ゴールドライフオンライン">
<meta property="og:description" content="GLOの作品をジャンルから探せます。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ゴールドライフオンライン">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&family=Shippori+Mincho:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* 雑誌の目次型（白地・文字が主役）。ジャンルごとの色は data/genres.js の hue を薄く使う */
  :root {
    --paper: #ffffff;
    --paper-2: #f6f4ef;
    --ink: #1d1d1f;
    --ink-sub: #55555a;
    --ink-faint: #85858a;
    --line: #e4e0d6;
    --accent: #8a6a32;      /* 番号・細い線（くすんだ金） */
    --link: #1f3a68;        /* 押せる文字（紺） */
    --font-heading: 'Shippori Mincho', serif;
    --font-body: 'Noto Sans JP', sans-serif;
    --hh: 50px;             /* ヘッダーの高さ（JSで実測して上書き） */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { font-family: var(--font-body); background: var(--paper); color: var(--ink); font-size: 16px; line-height: 1.8; }
  a { color: var(--link); }
  button { font-family: inherit; }
  img { display: block; }

  /* ジャンルごとの色（--h に色相を入れる） */
  .tinted { --g-deep: hsl(var(--h), 32%, 34%); --g-mid: hsl(var(--h), 26%, 62%); --g-soft: hsl(var(--h), 30%, 95%); --g-line: hsl(var(--h), 22%, 86%); }

  header { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,0.96); border-bottom: 1px solid var(--line); backdrop-filter: blur(8px); }
  .header-inner { max-width: 1000px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 12px; }
  .header-logo { height: 18px; }
  .header-sub { font-size: 12px; color: var(--ink-sub); letter-spacing: 1px; text-decoration: none; }
  .header-home { margin-left: auto; font-size: 13px; text-decoration: none; }

  .container { max-width: 1000px; margin: 0 auto; padding: 0 20px 64px; }
  .narrow { max-width: 760px; margin: 0 auto; }
  .screen { display: none; }
  .screen.active { display: block; }

  /* トップ */
  .masthead { padding: 44px 0 30px; text-align: center; }
  .eyebrow { font-size: 11px; letter-spacing: 4px; color: var(--accent); margin-bottom: 6px; }
  h1 { font-family: var(--font-heading); font-size: 32px; font-weight: 600; letter-spacing: 3px; line-height: 1.5; }
  .rule { width: 48px; height: 1px; background: var(--accent); margin: 16px auto; border: 0; }
  .lead { font-size: 15px; color: var(--ink-sub); }
  .stats { font-size: 13px; color: var(--ink-faint); margin-top: 4px; }

  .tiles { list-style: none; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .tile { display: flex; flex-direction: column; height: 100%; text-decoration: none; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; transition: border-color .15s, box-shadow .15s, transform .15s; }
  .tile:hover { border-color: var(--g-mid); box-shadow: 0 6px 18px rgba(0,0,0,0.07); transform: translateY(-2px); }
  .tile-covers { position: relative; height: 118px; background: var(--g-soft); border-bottom: 1px solid var(--g-line); display: flex; justify-content: center; align-items: flex-end; padding-bottom: 12px; }
  .tile-covers img { width: 58px; height: 84px; object-fit: cover; background: #fff; border-radius: 2px; box-shadow: 0 2px 6px rgba(0,0,0,0.16); margin: 0 -6px; }
  .tile-covers img:nth-child(1) { transform: rotate(-6deg) translateY(4px); }
  .tile-covers img:nth-child(2) { z-index: 1; width: 64px; height: 92px; }
  .tile-covers img:nth-child(3) { transform: rotate(6deg) translateY(4px); }
  .tile-no { font-family: var(--font-heading); font-size: 12px; letter-spacing: 2px; color: var(--g-deep); line-height: 1.4; }
  .tile-text { padding: 14px 16px 16px; display: flex; flex-direction: column; flex: 1; }
  .tile-name { font-family: var(--font-heading); font-size: 19px; font-weight: 600; letter-spacing: 1px; line-height: 1.5; }
  .tile-desc { font-size: 13px; color: var(--ink-sub); line-height: 1.75; margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tile-foot { margin-top: auto; padding-top: 10px; display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--ink-faint); }
  .tile-go { color: var(--link); font-size: 13px; font-weight: 500; }

  .cta { margin-top: 40px; padding: 22px 20px; background: var(--paper-2); border-radius: 4px; }
  .cta p { font-size: 14px; color: var(--ink-sub); }
  .cta a { display: inline-block; margin-top: 6px; font-weight: 500; font-size: 15px; }

  /* ジャンルのページ */
  .crumb { padding: 18px 0 0; font-size: 13px; color: var(--ink-faint); }
  .crumb a { text-decoration: none; }
  .list-head { margin-top: 12px; padding: 24px 24px 22px; background: var(--g-soft); border: 1px solid var(--g-line); border-radius: 6px; }
  .list-no { font-family: var(--font-heading); font-size: 13px; color: var(--g-deep); letter-spacing: 2px; }
  .list-title { font-family: var(--font-heading); font-size: 28px; font-weight: 600; letter-spacing: 2px; line-height: 1.5; }
  .list-desc { font-size: 15px; color: var(--ink-sub); margin-top: 8px; }
  .list-count { font-size: 13px; color: var(--ink-faint); margin-top: 8px; }

  .subnav-wrap { position: sticky; top: var(--hh); z-index: 10; background: rgba(255,255,255,0.97); margin: 0 -20px; padding: 0 20px; border-bottom: 1px solid var(--line); }
  .subnav-label { font-size: 11px; letter-spacing: 2px; color: var(--ink-faint); padding-top: 12px; }
  .subnav { list-style: none; display: flex; gap: 8px; overflow-x: auto; padding: 6px 24px 12px 0; scrollbar-width: thin; -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); }
  @media (pointer: coarse) { .subnav { scrollbar-width: none; } .subnav::-webkit-scrollbar { display: none; } }
  .subnav a { display: inline-flex; align-items: baseline; gap: 6px; white-space: nowrap; padding: 6px 14px; border: 1px solid var(--line); border-radius: 999px; font-size: 14px; color: var(--ink); text-decoration: none; background: #fff; transition: background .15s, border-color .15s; }
  .subnav a small { font-size: 12px; color: var(--ink-faint); }
  .subnav a:hover { border-color: var(--g-mid); }
  .subnav a.on { background: var(--g-deep); border-color: var(--g-deep); color: #fff; }
  .subnav a.on small { color: rgba(255,255,255,0.75); }

  .sub-sec { margin-top: 36px; scroll-margin-top: calc(var(--hh) + 96px); }
  .sub-title { font-family: var(--font-heading); font-size: 21px; font-weight: 600; letter-spacing: 1px; line-height: 1.5; padding-left: 12px; border-left: 3px solid var(--g-mid); }
  .sub-title small { font-family: var(--font-body); font-size: 13px; font-weight: 400; color: var(--ink-faint); margin-left: 8px; letter-spacing: 0; }
  .entries { list-style: none; margin-top: 10px; }
  .entry { display: flex; gap: 18px; padding: 20px 0; border-bottom: 1px solid var(--line); }
  .entry-cover { width: 84px; height: 122px; flex-shrink: 0; background: var(--g-soft); border: 1px solid var(--line); border-radius: 2px; overflow: hidden; display: flex; align-items: center; justify-content: center; text-decoration: none; }
  .entry-cover img { width: 100%; height: 100%; object-fit: cover; }
  .entry-cover .ph { font-family: var(--font-heading); font-size: 28px; color: var(--g-mid); }
  .entry-body { flex: 1; min-width: 0; }
  .entry-title { display: block; font-family: var(--font-heading); font-size: 18px; font-weight: 600; line-height: 1.6; color: var(--ink); text-decoration: none; }
  .entry-title:hover { text-decoration: underline; }
  .entry-meta { font-size: 13px; color: var(--ink-sub); margin-top: 2px; }
  .entry-live { display: inline-block; font-size: 11px; color: var(--accent); border: 1px solid var(--accent); padding: 0 6px; margin-left: 8px; line-height: 1.6; vertical-align: 1px; border-radius: 2px; }
  .entry-sum { font-size: 14px; color: var(--ink-sub); line-height: 1.85; margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .entry-links { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
  .entry-links a { display: inline-block; padding: 6px 16px; border-radius: 4px; font-size: 14px; font-weight: 500; text-decoration: none; border: 1px solid var(--link); }
  .entry-links a.primary { background: var(--link); color: #fff; }
  .entry-links a:not(.primary) { color: var(--link); background: #fff; }
  .entry-links a:hover { opacity: 0.85; }
  .btn-more { display: block; width: 100%; margin-top: 14px; padding: 12px; background: #fff; border: 1px solid var(--line); border-radius: 4px; font-size: 14px; color: var(--link); cursor: pointer; }
  .btn-more:hover { border-color: var(--link); }

  .pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 48px; }
  .pager a { display: block; padding: 14px 16px; border: 1px solid var(--line); border-radius: 6px; text-decoration: none; color: var(--ink); }
  .pager a:hover { border-color: var(--link); }
  .pager small { display: block; font-size: 12px; color: var(--ink-faint); }
  .pager span { font-family: var(--font-heading); font-size: 16px; font-weight: 600; }
  .pager .next { text-align: right; grid-column: 2; }
  .back-all { display: block; margin: 16px auto 0; text-align: center; font-size: 14px; text-decoration: none; }

  .footer { margin-top: 48px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-faint); text-align: center; }
  .footer a { color: var(--ink-faint); text-decoration: none; }
  .to-top { position: fixed; right: 14px; bottom: 18px; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: #fff; color: var(--ink-sub); font-size: 18px; cursor: pointer; display: none; box-shadow: 0 2px 8px rgba(0,0,0,0.08); z-index: 30; }
  .to-top.show { display: block; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }

  @media (max-width: 760px) {
    .tiles { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  }
  @media (max-width: 480px) {
    .header-inner { padding: 10px 16px; }
    .header-sub { display: none; }
    .container { padding: 0 16px 56px; }
    .subnav-wrap { margin: 0 -16px; padding: 0 16px; }
    .masthead { padding: 30px 0 22px; }
    h1 { font-size: 27px; }
    .lead { font-size: 14px; }
    .tile-covers { height: 98px; padding-bottom: 10px; }
    .tile-covers img { width: 46px; height: 67px; }
    .tile-covers img:nth-child(2) { width: 52px; height: 75px; }
    .tile-text { padding: 10px 12px 12px; }
    .tile-name { font-size: 16px; letter-spacing: 0.5px; }
    .tile-desc { display: none; }
    .tile-go, .tile-subs { display: none; }
    .list-head { padding: 18px 16px; }
    .list-title { font-size: 24px; }
    .list-desc { font-size: 14px; }
    .entry { gap: 14px; }
    .entry-cover { width: 68px; height: 99px; }
    .entry-title { font-size: 17px; }
    .entry-links a { padding: 6px 12px; font-size: 13px; }
  }

  /* おすすめ作品診断の枠：診断ページができるまで非表示（表示に戻すときは、この1行を消す） */
  .cta { display: none !important; }
</style>
</head>
<body>

<header id="siteHeader">
  <div class="header-inner">
    <img class="header-logo" src="https://renaissance-media.jp/common/glo/images/logo.svg" alt="GLO">
    <a class="header-sub" href="#">ジャンルから探す</a>
    <a class="header-home" href="https://renaissance-media.jp/" target="_blank" rel="noopener">GLOトップへ →</a>
  </div>
</header>

<div class="container">

  <div id="top" class="screen active">
    <div class="masthead">
      <p class="eyebrow">GOLD LIFE ONLINE</p>
      <h1>ジャンルから探す</h1>
      <hr class="rule">
      <p class="lead">読んでみたいジャンルを選んでください。<br>小さなジャンルごとに作品が並んでいます。</p>
      <p class="stats" id="stats"></p>
    </div>

    <ol class="tiles" id="tiles"></ol>

    <div class="cta">
      <p>何を読むか決められない方へ</p>
      <a href="https://renaissance-media.jp/articles/-/27372" target="_blank" rel="noopener">星よみ、今日の一枚。カードをめくって今日の一冊に出会う →</a>
    </div>

    <div class="footer"><a href="https://renaissance-media.jp/" target="_blank" rel="noopener">© ゴールドライフオンライン</a></div>
  </div>

  <div id="list" class="screen tinted">
    <div class="narrow">
      <p class="crumb"><a href="#">ジャンルから探す</a> › <span id="crumbName"></span></p>
      <div class="list-head">
        <p class="list-no" id="listNo"></p>
        <h2 class="list-title" id="listTitle"></h2>
        <p class="list-desc" id="listDesc"></p>
        <p class="list-count" id="listCount"></p>
      </div>
    </div>
    <div class="subnav-wrap">
      <div class="narrow">
        <p class="subnav-label">小さなジャンル</p>
        <ul class="subnav" id="subnav"></ul>
      </div>
    </div>
    <div class="narrow">
      <div id="listSubs"></div>
      <nav class="pager" id="pager"></nav>
      <a class="back-all" href="#">ジャンル一覧に戻る</a>
      <div class="footer"><a href="https://renaissance-media.jp/" target="_blank" rel="noopener">© ゴールドライフオンライン</a></div>
    </div>
  </div>

</div>
<button class="to-top" id="toTop" aria-label="ページの上へ">↑</button>

<script src="data/genres.js"></script>
<script src="data/covers_manual.js"></script>
<script src="data/covers_auto.js"></script>
<script>
const DATA = window.GLO_DATA || { genres: [] };
const GENRES = DATA.genres;
const COVERS = Object.assign({}, window.COVERS_AUTO || {}, window.COVERS_MANUAL || {});
const SITE = 'https://renaissance-media.jp';
const FIRST_SHOW = 10;
const BASE_TITLE = document.title;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const no = i => String(i + 1).padStart(2, '0');
const catUrl = w => SITE + '/category/' + encodeURIComponent(w.c);
const firstUrl = w => w.f ? SITE + '/articles/-/' + w.f : '';
const COVER_BASE = 'https://renaissance-media.ismcdn.jp/mwimgs/';
function coverUrl(w) {
  const h = COVERS[w.c];
  if (!h) return '';
  if (/^https?:/.test(h)) return h;
  return COVER_BASE + h[0] + '/' + h[1] + '/240w/img_' + h;
}
const $ = id => document.getElementById(id);

// 並び順は「よく読まれている順（累計）」だけにする
GENRES.forEach(g => g.subs.forEach(s => s.works.sort((a, b) => (b.pv || 0) - (a.pv || 0))));

const total = GENRES.reduce((a, g) => a + g.count, 0);
const subTotal = GENRES.reduce((a, g) => a + g.subs.length, 0);
$('stats').textContent = '全' + total.toLocaleString() + '作品／' + GENRES.length + 'ジャンル／' + subTotal + 'の小さなジャンル';

// ヘッダーの高さに合わせて、小さなジャンルの帯を止める位置を決める
const header = $('siteHeader');
const setHH = () => document.documentElement.style.setProperty('--hh', header.offsetHeight + 'px');
setHH(); window.addEventListener('resize', setHH);

/* トップ：ジャンルのカード（表紙は、そのジャンルでよく読まれている作品から3冊） */
function topCovers(g) {
  const seen = {}, all = [];
  g.subs.forEach(s => s.works.forEach(w => { if (!seen[w.c]) { seen[w.c] = 1; all.push(w); } }));
  all.sort((a, b) => (b.pv || 0) - (a.pv || 0));
  const out = [];
  for (const w of all) { const u = coverUrl(w); if (u) out.push(u); if (out.length === 3) break; }
  return out;
}
$('tiles').innerHTML = GENRES.map((g, i) =>
  '<li><a class="tile tinted" href="#' + esc(g.id) + '" style="--h:' + (+g.hue || 0) + '">' +
    '<span class="tile-covers">' +
      topCovers(g).map(u => '<img src="' + esc(u) + '" alt="" loading="lazy" decoding="async" onerror="this.remove()">').join('') +
    '</span>' +
    '<span class="tile-text"><span class="tile-no">' + no(i) + '</span><span class="tile-name">' + esc(g.name) + '</span>' +
      '<span class="tile-desc">' + esc(g.desc) + '</span>' +
      '<span class="tile-foot"><span>' + g.count + '作品<span class="tile-subs">・小さなジャンル' + g.subs.length + '</span></span><span class="tile-go">見る →</span></span>' +
    '</span></a></li>').join('');

/* 作品 */
function entry(w) {
  const u = coverUrl(w);
  const cover = '<a class="entry-cover" href="' + catUrl(w) + '" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true">' +
    (u ? '<img src="' + esc(u) + '" alt="" loading="lazy" decoding="async" onerror="this.replaceWith(Object.assign(document.createElement(\'span\'),{className:\'ph\',textContent:this.dataset.c}))" data-c="' + esc((w.t || '').charAt(0)) + '">'
       : '<span class="ph">' + esc((w.t || '').charAt(0)) + '</span>') + '</a>';
  return '<li class="entry">' + cover + '<div class="entry-body">' +
    '<a class="entry-title" href="' + catUrl(w) + '" target="_blank" rel="noopener">' + esc(w.t) + '</a>' +
    '<p class="entry-meta">' + esc(w.a) + (w.l ? '<span class="entry-live">連載中</span>' : '') + '</p>' +
    (w.s ? '<p class="entry-sum">' + esc(w.s) + '</p>' : '') +
    '<p class="entry-links">' + (w.f ? '<a class="primary" href="' + firstUrl(w) + '" target="_blank" rel="noopener">第1回から読む</a>' : '') +
      '<a href="' + catUrl(w) + '" target="_blank" rel="noopener">記事一覧</a></p>' +
    '</div></li>';
}

/* ジャンルのページ（URLの # でジャンルを覚えるので、ブラウザの「戻る」も使える） */
let curGenre = null, lastGenreId = null;
function showList(g) {
  curGenre = g; lastGenreId = g.id;
  const gi = GENRES.indexOf(g);
  $('list').style.setProperty('--h', +g.hue || 0);
  $('crumbName').textContent = g.name;
  $('listNo').textContent = 'GENRE ' + no(gi);
  $('listTitle').textContent = g.name;
  $('listDesc').textContent = g.desc;
  $('listCount').textContent = g.count.toLocaleString() + '作品・よく読まれている順に並んでいます';
  $('subnav').innerHTML = g.subs.map(s => '<li><a href="#' + esc(g.id) + '/' + esc(s.code) + '" data-s="' + esc(s.code) + '">' + esc(s.name) + '<small>' + s.works.length + '</small></a></li>').join('');
  $('listSubs').innerHTML = g.subs.map(s => {
    const rest = s.works.length - FIRST_SHOW;
    return '<section class="sub-sec" id="sub-' + esc(s.code) + '"><h3 class="sub-title">' + esc(s.name) + '<small>' + s.works.length + '作品</small></h3>' +
      '<ol class="entries">' + s.works.slice(0, FIRST_SHOW).map(entry).join('') + '</ol>' +
      (rest > 0 ? '<button class="btn-more" data-s="' + esc(s.code) + '">残り' + rest + '作品を表示</button>' : '') + '</section>';
  }).join('');
  const prev = GENRES[gi - 1], next = GENRES[gi + 1];
  $('pager').innerHTML =
    (prev ? '<a class="prev" href="#' + esc(prev.id) + '"><small>← 前のジャンル</small><span>' + esc(prev.name) + '</span></a>' : '') +
    (next ? '<a class="next" href="#' + esc(next.id) + '"><small>次のジャンル →</small><span>' + esc(next.name) + '</span></a>' : '');
  document.title = g.name + '｜' + BASE_TITLE;
  $('top').classList.remove('active');
  $('list').classList.add('active');
  markSub(g.subs[0] ? g.subs[0].code : "");
}
$('listSubs').addEventListener('click', e => {
  const b = e.target.closest('.btn-more');
  if (!b || !curGenre) return;
  const s = curGenre.subs.find(x => x.code === b.dataset.s);
  b.previousElementSibling.insertAdjacentHTML('beforeend', s.works.slice(FIRST_SHOW).map(entry).join(''));
  b.remove();
});

// 小さなジャンルの帯：押すとその見出しへ。いま見ている見出しに色をつける
function jumpTo(code, smooth) {
  const el = $('sub-' + code);
  if (!el) return;
  const y = el.getBoundingClientRect().top + window.scrollY - parseFloat(getComputedStyle(el).scrollMarginTop || 0);
  window.scrollTo({ top: Math.max(0, y), behavior: smooth ? 'smooth' : 'auto' });
}
$('subnav').addEventListener('click', e => {
  const a = e.target.closest('a[data-s]');
  if (!a) return;
  e.preventDefault();
  history.replaceState(null, '', a.getAttribute('href'));
  jumpTo(a.dataset.s, true);
});
function markSub(code) {
  $('subnav').querySelectorAll('a').forEach(a => {
    const on = a.dataset.s === code;
    if (on && !a.classList.contains('on')) {
      const nav = $('subnav'), li = a.parentNode;
      nav.scrollLeft = li.offsetLeft - nav.offsetLeft - (nav.clientWidth - li.offsetWidth) / 2;
    }
    a.classList.toggle('on', on);
  });
}
let ticking = false;
function updateSub() {
  ticking = false;
  if (!curGenre) return;
  const line = header.offsetHeight + 110;
  let cur = '';
  document.querySelectorAll('.sub-sec').forEach(s => { if (s.getBoundingClientRect().top <= line) cur = s.id.slice(4); });
  markSub(cur);
}
window.addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(updateSub); } }, { passive: true });

function showTop() {
  curGenre = null;
  document.title = BASE_TITLE;
  $('list').classList.remove('active');
  $('top').classList.add('active');
  // 見ていたジャンルのカードの位置に戻る
  const a = lastGenreId && document.querySelector('.tile[href="#' + lastGenreId + '"]');
  if (a) { a.scrollIntoView({ block: 'center' }); a.focus({ preventScroll: true }); }
  else window.scrollTo(0, 0);
}

function route() {
  const [gid, sub] = decodeURIComponent(location.hash.slice(1)).split('/');
  const g = GENRES.find(x => x.id === gid);
  if (!g) { showTop(); return; }
  if (g !== curGenre) { showList(g); window.scrollTo(0, 0); }
  if (sub) requestAnimationFrame(() => jumpTo(sub, false));
}
window.addEventListener('hashchange', route);
route();

const toTop = $('toTop');
window.addEventListener('scroll', () => toTop.classList.toggle('show', window.scrollY > 800), { passive: true });
toTop.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
</script>
</body>
</html>
