# kintoneの項目一覧を確認する（データの中身は出さない）
# 実行方法：GitHubの「Actions」タブ →「kintoneの項目一覧を確認」→「Run workflow」
name: kintoneの項目一覧を確認

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fields:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 項目一覧を出力
        env:
          KINTONE_DOMAIN: ${{ secrets.KINTONE_DOMAIN }}
          KINTONE_TOKEN_402: ${{ secrets.KINTONE_TOKEN_402 }}
          KINTONE_TOKEN_507: ${{ secrets.KINTONE_TOKEN_507 }}
          KINTONE_TOKEN_491: ${{ secrets.KINTONE_TOKEN_491 }}
          KINTONE_TOKEN_341: ${{ secrets.KINTONE_TOKEN_341 }}
        run: python .github/workflows/scripts/kintone_fields.py
