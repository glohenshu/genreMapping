# index.html などを手で直して保存（コミット）したときに、ページを公開し直す（公開するのは scripts/collect_site.sh で集めたファイルだけ）。
name: ページを公開

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 公開するファイルだけを集める
        run: bash scripts/collect_site.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - id: deploy
        uses: actions/deploy-pages@v4
